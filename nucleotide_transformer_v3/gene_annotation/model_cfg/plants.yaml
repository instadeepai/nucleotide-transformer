# NTv3 genome annotation, plants.
#
# The direct twin of mammals.yaml: same backbone, same 1 Mb window, same
# annotation-only post-training recipe, a different clade. Every field below was
# read back from the checkpoint's own saved training config on 2026-09-03.

description: >-
  Plant gene structure. NTv3 703M length-extended to 1 Mb, post-trained on 53
  plant assemblies with a 15-state annotation head.

# The released model these weights are an export of. Checked against the
# export's own provenance.source_model_name at load, because weights_uri
# names a DIRECTORY the user chose: staging the plant export into a folder
# called mammals would otherwise annotate a mammal genome with the plant
# model and report success. Nothing else distinguishes the three -- they
# share their 15 classes, their geometry and their conditioning.
model_name: new_ntv3_700M_annotate_plants_1mb

# Where the converted weights live: a directory holding
# hyperparameters.json + flax_model.msgpack + tokenizer_config.json.
#
# The released model, downloaded from InstaDeepAI/<name>/jax_model/ on the
# Hub and cached, so this clade needs nothing staged. The repo is gated,
# so it needs a Hugging Face login with approved access.
#
# Set NTV3_ANNOTATE_WEIGHTS_DIR to a directory of per-clade subdirectories
# to load from disk instead -- it would read plants/ under it.
weights_uri: NTv3_annot_plants

sequence_length: 1048576

# 0.75, and it is now MEASURED on plants rather than inherited from the mammal
# sweep. Not the checkpoint's own trained crop, which its training config records
# as 1.0. Mean gene F1 over the five held-out test species, whole genome,
# hmm_constrained, checkpoint 286110:
#
#   ktcf 0.375   72.48
#   ktcf 0.75    72.67   <-- the registered value, and the best of the three
#   ktcf 1.0     72.35   (the trained crop)
#
# 0.75 wins on all five species individually, by a remarkably uniform +0.19 to
# +0.35 over the trained 1.0. Small in absolute terms - the whole range spans
# 0.32 F1 - but consistent in direction rather than noise-shaped.
#
# AN EARLIER VERSION OF THIS NOTE GOT THE REASONING WRONG, and the error is worth
# keeping because it is easy to repeat: it argued that since 0.375 and 1.0 sat
# 0.13 F1 apart, 0.75 "cannot fall outside it". That assumes the crop effect is
# monotonic between the two endpoints. It is not. 0.75 is above BOTH, so
# interpolating between measured crops is not sound and the intermediate value
# had to be run. It has been.
keep_target_center_fraction: 0.75

softmasking: true

# False, for exactly the reasons spelled out in mammals.yaml: the species
# tokenizer and embedding table exist, but enable_trunk_conditioning,
# condition_annotation_head and condition_bigwig_head are all false in the
# saved config, so the species input cannot reach the annotation output.
species_conditioned: false

verified: true
verified_on: "2026-09-22"

# The species tokenizer's own standard_tokens, read from the checkpoint. As in
# mammals.yaml this is the training-set roster, not an input menu: species is
# not consumed, so there is nothing to pass. (Note the mixed convention if you
# read it as a list of assemblies: most are latin binomials, a handful of major
# crops are common names.)
