notes: >-
  Step 286110 (300 B tokens) is now a SELECTED checkpoint, which is why this
  entry moved off 381480. Ranking the six checkpoints of this run that carry a
  whole-genome test evaluation by mean gene F1 over the five held-out plant test
  species (hmm_constrained, the decoder production uses) puts 286110 first at
  both evaluated crops: 68.14 at 100 B, 71.76 at 200 B, 72.35 at 300 B, then
  71.52, 71.84 and 70.86 at 400, 500 and 600 B. The run peaked at 300 B and has
  drifted since, so the previous pin - the latest evaluated step rather than the
  best - was 0.83 gene F1 worse than what was already available. That note ended
  by saying the run was still training, that a later checkpoint might beat this
  one, and that re-pinning would then be a one-line change here. It was: see the
  next paragraph.
  RE-PINNED 2026-09-21, 286110 -> 877404 (920 B, the run's final checkpoint), which
  is that anticipated one-line change. The run has since finished and three later
  checkpoints were evaluated whole-genome at the registered crop: 667590 reads 72.45
  mean gene F1, 858330 72.88 and 877404 73.20, against 286110's 72.67. So the drift
  this note described reversed and the run ended above its 300 B peak. 877404 is also
  the best of the ten checkpoints on the held-out VALIDATION species (76.42 mean gene
  F1), so test and validation agree on it, which the previous pin could not claim -
  it was selected on test alone.
  ONE CAVEAT ON THE DELTA: the three new evaluations ran with bf16 compute where
  286110's ran in fp32, which is worth about +0.17 gene F1 ON THE MAMMAL A/B. No
  plant A/B has been run, so applying it here is a CROSS-CLADE TRANSFER and not a
  plant measurement - roughly a third of the +0.53 rests on it. Read the split as
  +0.35 of checkpoint and +0.17 of dtype if the transfer holds, and the whole
  +0.53 as checkpoint-plus-dtype either way. The three new points are mutually
  comparable, and 877404 is the best of them; closing the caveat is one paired
  plant evaluation at 877404 in fp32.
  For scale on the number: at the registered 0.75 crop the PREVIOUS pin read
  72.67 mean gene F1, which is +5.65 over Tiberius angiosperms rescored in-house
  on the same contigs with the same evaluator (67.02), ahead on all five species,
  and now marginally ahead of the old-architecture 53-species 131 kb run (72.39)
  that has been the plant model of record. Marginally: +0.28 is inside the range
  the crop alone moves, so read it as level rather than as a win.
  Those figures are longest-isoform on every side. The Tiberius preprint's plant
  table uses any-isoform matching, worth +2.8 to +8.2 gene F1 on plants, and
  their angiosperm model reads unmasked sequence where this one reads the
  soft-masked vocabulary, so this number belongs next to our own rescoring of
  their predictions and never next to their published plant table.
  To annotate at a crop other than the registered one, use
  scripts/ntv3_genome_annotation/annotate/, which exposes
  keep_target_center_fraction and accepts any value up to the trained 1.0.
  Dropping model_cfg does NOT unlock it: production refuses any crop but its
  own on every path, by design, so that every number it emits is comparable.
